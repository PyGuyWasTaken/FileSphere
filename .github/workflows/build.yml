name: Build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - name: Verify TypeScript installation
        run: npm ls typescript --depth=0 && test -x node_modules/.bin/tsc && node_modules/.bin/tsc --version
      - run: npm run check
      - run: npm run build
